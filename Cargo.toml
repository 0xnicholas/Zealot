[package]
name = "zealot-engine"
version = "0.1.0"
edition = "2021"
description = "Zealot — standalone Rust inference engine, no vLLM fork. Sole consumer: Ultralisk inference platform."

[lib]
name = "zealot_engine"
# cdylib → Python 扩展（maturin）；rlib → zealot-backend bin 复用 scheduler/engine
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
dashmap = "6"
rand = "0.8"
# zealot-backend bin: Runtime Interface gRPC server (ADR-010)
tonic = "0.13"
prost = "0.13"
prost-types = "0.13"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util"] }
tokio-stream = "0.1"
cudarc = { version = "0.13", optional = true }
axum = "0.8"
tower-http = { version = "0.6", features = ["cors"] }
futures = "0.3"
lru = "0.18.2"

[build-dependencies]
tonic-build = "0.13"
protoc-bin-vendored = "3"
which = "6"

[dev-dependencies]
pyo3 = { version = "0.23", features = ["auto-initialize"] }
# M4 §12-2: Block Manager free list 并发模拟测试（loom model checker）
loom = "0.7"
# M4 §8.1: FFI 微基准（benches/）
criterion = "0.5"
# M4 §8: Block Manager 随机操作序列 property-based 测试
proptest = "1"

[[bench]]
name = "block_manager"
harness = false

[[bench]]
name = "constrained_decode"
harness = false

[profile.release]
lto = true
opt-level = 3
codegen-units = 1

[features]
cuda = ["dep:cudarc", "cudarc/cuda-12080"]
default = []
