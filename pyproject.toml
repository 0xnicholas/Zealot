[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "zealot"
version = "0.1.0"
requires-python = ">=3.10"
description = "Zealot — standalone Rust inference engine, no vLLM fork. Sole consumer: Ultralisk inference platform."

[tool.maturin]
module-name = "zealot_engine"
features = ["pyo3/extension-module"]
